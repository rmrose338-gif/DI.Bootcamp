<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex App</title>
  <!-- Google Fonts & FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #3a3d40 0%, #181a1b 100%);
      font-family: 'Rajdhani', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
    }

    /* Outer Pokédex Case */
    .pokedex-container {
      background: linear-gradient(145deg, #e6193c, #b3001e);
      width: 380px;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 2px 5px rgba(255, 255, 255, 0.4);
      border: 4px solid #700010;
      position: relative;
    }

    /* Top Camera Sensor / Lights */
    .pokedex-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .main-light {
      width: 50px;
      height: 50px;
      background: radial-gradient(circle at 30% 30%, #85d7ff, #0088cc);
      border: 4px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 15px #0088cc;
    }

    .small-light {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid #000;
    }
    .red { background: #ff4d4d; box-shadow: 0 0 5px #ff4d4d; }
    .yellow { background: #ffcc00; box-shadow: 0 0 5px #ffcc00; }
    .green { background: #2ed573; box-shadow: 0 0 5px #2ed573; }

    /* Screen Frame & Display Area */
    .screen-frame {
      background: #dedede;
      border-radius: 12px;
      padding: 15px;
      border: 3px solid #b8b8b8;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3);
    }

    .screen {
      background-color: #232323;
      border-radius: 8px;
      padding: 15px;
      min-height: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 3px solid #111;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .pokemon-img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
    }

    .pokemon-name {
      font-family: 'Press Start 2P', cursive;
      color: #ffcb05;
      font-size: 0.9rem;
      text-transform: uppercase;
      margin: 12px 0 8px;
      text-shadow: 2px 2px #2a75bb;
    }

    .pokemon-info {
      font-size: 1.1rem;
      color: #00f0ff;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .pokemon-info span {
      color: #fff;
    }

    .status-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: #ffcb05;
    }

    .status-box.error {
      color: #ff4d4d;
    }

    /* Directional & Function Controls */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      gap: 10px;
    }

    .btn {
      background: #222;
      color: #fff;
      border: 2px solid #000;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 4px 0 #000;
      transition: all 0.1s ease;
    }

    .btn:hover {
      background: #333;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #000;
    }

    .btn-random {
      background: #ffcb05;
      color: #2a75bb;
      border-color: #2a75bb;
      box-shadow: 0 4px 0 #c79a00;
      font-size: 1.1rem;
      flex-grow: 1;
    }

    .btn-random:hover {
      background: #ffe169;
    }

    .btn-random:active {
      box-shadow: 0 0 0 #c79a00;
    }
  </style>
</head>
<body>

  <div class="pokedex-container">
    <!-- Pokédex Decorative Top Header -->
    <div class="pokedex-top">
      <div class="main-light"></div>
      <div class="small-light red"></div>
      <div class="small-light yellow"></div>
      <div class="small-light green"></div>
    </div>

    <!-- Screen Frame & Display Area -->
    <div class="screen-frame">
      <div class="screen" id="display-screen">
        <p style="color: #aaa; font-size: 1.1rem;">Press <strong>Random</strong> or use navigation arrows to search Pokémon!</p>
      </div>
    </div>

    <!-- Navigation Buttons -->
    <div class="controls">
      <button class="btn" id="prev-btn"><i class="fa-solid fa-chevron-left"></i></button>
      <button class="btn btn-random" id="random-btn">Random</button>
      <button class="btn" id="next-btn"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
  </div>

  <script>
    // Global variable tracking currently displayed Pokémon ID
    let currentPokemonId = null;

    // Maximum Pokédex count for primary generations
    const TOTAL_POKEMON = 898;

    // DOM Elements
    const displayScreen = document.getElementById("display-screen");
    const randomBtn = document.getElementById("random-btn");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");

    // Event Listeners
    randomBtn.addEventListener("click", fetchRandomPokemon);
    prevBtn.addEventListener("click", fetchPrevPokemon);
    nextBtn.addEventListener("click", fetchNextPokemon);

    // Primary Async/Await function fetching PokéAPI data
    async function fetchPokemon(idOrName) {
      showLoading();

      try {
        const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${idOrName}`);

        // Debug Error 1: Handle HTTP error statuses (like 404s) explicitly
        if (!response.ok) {
          throw new Error("Pokémon unavailable");
        }

        const data = await response.json();

        // Update global tracker variable
        currentPokemonId = data.id;

        // Debug Error 2: Safely extract artwork with fallbacks
        const spriteUrl = 
          data.sprites.other?.["official-artwork"]?.front_default || 
          data.sprites.front_default || 
          "";

        // Map type values into a formatted string
        const types = data.types.map(t => t.type.name).join(", ");

        // Render formatted result to DOM
        renderPokemon({
          id: data.id,
          name: data.name,
          height: data.height,
          weight: data.weight,
          type: types,
          image: spriteUrl
        });

      } catch (error) {
        showError();
      }
    }

    // 1. Fetch Random Pokémon
    async function fetchRandomPokemon() {
      const randomId = Math.floor(Math.random() * TOTAL_POKEMON) + 1;
      await fetchPokemon(randomId);
    }

    // 2. Fetch Previous Pokémon
    async function fetchPrevPokemon() {
      // Debug Error 3: Wrap around ID bounds cleanly
      if (!currentPokemonId || currentPokemonId <= 1) {
        await fetchPokemon(TOTAL_POKEMON);
      } else {
        await fetchPokemon(currentPokemonId - 1);
      }
    }

    // 3. Fetch Next Pokémon
    async function fetchNextPokemon() {
      // Debug Error 3: Wrap around ID bounds cleanly
      if (!currentPokemonId || currentPokemonId >= TOTAL_POKEMON) {
        await fetchPokemon(1);
      } else {
        await fetchPokemon(currentPokemonId + 1);
      }
    }

    // UI Helper: Loading state UI
    function showLoading() {
      displayScreen.innerHTML = `
        <div class="status-box">
          <i class="fa-solid fa-spinner fa-spin fa-3x"></i>
          <p>Scanning Database...</p>
        </div>
      `;
    }

    // UI Helper: Render Pokémon details
    function renderPokemon(pokemon) {
      displayScreen.innerHTML = `
        <img class="pokemon-img" src="${pokemon.image}" alt="${pokemon.name}">
        <h2 class="pokemon-name">#${pokemon.id} ${pokemon.name}</h2>
        <div class="pokemon-info">
          <p><strong>Type:</strong> <span>${pokemon.type}</span></p>
          <p>
            <strong>HT:</strong> <span>${pokemon.height / 10}m</span> | 
            <strong>WT:</strong> <span>${pokemon.weight / 10}kg</span>
          </p>
        </div>
      `;
    }

    // UI Helper: Render Error state UI
    function showError() {
      displayScreen.innerHTML = `
        <div class="status-box error">
          <i class="fa-solid fa-triangle-exclamation fa-3x"></i>
          <p>Oh no! That Pokemon isn't available...</p>
        </div> 
      `;
    }
  </script>
</body>
</html>
