<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 7: My Book List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .listBooks {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .book {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .book img {
            width: 100px;
            height: auto;
            margin-bottom: 10px;
        }
        .book-details {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>My Book List</h1>
    <section class="listBooks"></section>

    <script src="exercise7.js"></script>
</body>
</html>
