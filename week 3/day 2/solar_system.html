<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Solar System</title>
    <style>
      body {
        background-color: black;
        padding: 10px;
      }

      .planet {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        text-align: center;
        padding: 10px;
        position: relative;
        border: 2px solid white;
        display: inline-block;
        margin: 20px;
        color: white;
        font-weight: bold;
        line-height: 100px;
      }

      .moon {
        position: absolute;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: rgb(237, 237, 237);
        border: 2px solid red;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <section class="listPlanets"></section>
    <script src="daily challange 1.js"></script>
  </body>
</html>
