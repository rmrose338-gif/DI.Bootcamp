<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 2 - Work with forms</title>
  </head>
  <body>
    <form id="userForm">
      <label for="fname">First name:</label><br />
      <input type="text" id="fname" name="firstname" /><br />
      <label for="lname">Last name:</label><br />
      <input type="text" id="lname" name="lastname" /><br /><br />
      <input type="submit" value="Submit" id="submit" />
    </form>

    <ul class="usersAnswer"></ul>

    <script>
      // 1. Retrieve the form and console.log it.
      const form = document.querySelector('form');

      // 2. Retrieve the inputs by their id and console.log them.
      const firstNameInput = document.getElementById('fname');
      const lastNameInput = document.getElementById('lname');

      // 3. Retrieve the inputs by their name attribute and console.log them.
      const firstNameByName = document.getElementsByName('firstname');
      const lastNameByName = document.getElementsByName('lastname');

      // Target the list below the form.
      const usersAnswer = document.querySelector('.usersAnswer');

      console.log(form);
      console.log(firstNameInput);
      console.log(lastNameInput);
      console.log(firstNameByName);
      console.log(lastNameByName);

      // 4. When the user submits the form, prevent the page from refreshing,
      // then collect the values, validate them, and display them as list items.
      form.addEventListener('submit', (event) => {
        event.preventDefault(); // Prevent the browser from reloading the page.

        const firstNameValue = firstNameInput.value.trim();
        const lastNameValue = lastNameInput.value.trim();

        usersAnswer.innerHTML = '';

        if (firstNameValue !== '') {
          const firstLi = document.createElement('li');
          firstLi.textContent = firstNameValue;
          usersAnswer.appendChild(firstLi);
        }

        if (lastNameValue !== '') {
          const lastLi = document.createElement('li');
          lastLi.textContent = lastNameValue;
          usersAnswer.appendChild(lastLi);
        }
      });
    </script>
  </body>
</html>
