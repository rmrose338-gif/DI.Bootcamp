<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pretty Little Drumset</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="mini project 2.css">
  <script src="mini project 2.js" defer></script>
</head>
<body>
  <main class="drum-app">
    <div class="spotlight spotlight-one"></div><div class="spotlight spotlight-two"></div>
    <header class="header">
      <div class="brand"><span class="brand-dot"></span><p class="eyebrow">Pretty little rhythm room</p></div>
      <h1>Make some <span>sparkle.</span></h1>
      <p class="intro">Tap a pad or use the matching key to make your own pop beat.</p>
    </header>
    <section class="drum-machine" aria-label="Drum machine">
      <span class="butterfly butterfly-one" aria-hidden="true">&#129419;</span>
      <span class="butterfly butterfly-two" aria-hidden="true">&#129419;</span>
      <span class="sparkle sparkle-one" aria-hidden="true">&#10024;</span>
      <span class="sparkle sparkle-two" aria-hidden="true">&#10024;</span>
      <div class="machine-top"><span>DR-05 / GLITTER BEAT</span><span id="last-hit">READY</span></div>
      <div id="drum-pads" class="drum-pads"></div>
      <div class="machine-footer"><span class="led"></span> AUDIO ONLINE <span class="footer-line"></span> 08 SOUNDS</div>
    </section>
    <p class="tip">A Heartbeat &middot; S Snap &middot; D Shimmer &middot; F Sparkle &middot; G Blush &middot; H Twinkle &middot; J Bell &middot; K Pop</p>
  </main>
</body>
</html>
