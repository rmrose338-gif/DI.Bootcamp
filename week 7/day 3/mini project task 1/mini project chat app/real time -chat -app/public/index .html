<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Real-time Chat App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Join Screen -->
  <div id="join-container" class="card">
    <h2>Join Chat Room</h2>
    <form id="join-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username..." required />
      </div>
      <div class="form-group">
        <label for="room">Select Room</label>
        <select id="room">
          <option value="General">General</option>
          <option value="Tech">Tech</option>
          <option value="Gaming">Gaming</option>
        </select>
      </div>
      <button type="submit" class="btn">Join Chat</button>
    </form>
  </div>

  <!-- Chat Workspace -->
  <div id="chat-container" class="card hidden">
    <header class="chat-header">
      <h3 id="room-name">Room Name</h3>
      <button id="leave-btn" class="btn btn-secondary">Leave Room</button>
    </header>

    <div class="chat-main">
      <!-- Sidebar for Active Users -->
      <aside class="chat-sidebar">
        <h4>Active Users</h4>
        <ul id="users-list"></ul>
      </aside>

      <!-- Messages Window -->
      <main class="chat-messages" id="chat-messages"></main>
    </div>

    <!-- Message Input Form -->
    <form id="chat-form" class="chat-input-area">
      <input type="text" id="msg" placeholder="Type a message..." required autocomplete="off" />
      <button type="submit" class="btn">Send</button>
    </form>
  </div>

  <!-- Socket.io Client Script -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="main.js"></script>
</body>
</html>
