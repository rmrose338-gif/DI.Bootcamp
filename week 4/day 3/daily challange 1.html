<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form to JSON String</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    #output { margin-top: 15px; font-family: monospace; font-size: 1.1rem; }
  </style>
</head>
<body>

  <form id="user-form">
    <div class="form-group">
      <label for="fname">First Name:</label>
      <input type="text" id="fname" required>
    </div>

    <div class="form-group">
      <label for="lname">Last Name:</label>
      <input type="text" id="lname" required>
    </div>

    <button type="submit">Send</button>
  </form>

  <!-- Section where the JSON output will appear -->
  <div id="output"></div>

  <script>
    document.getElementById('user-form').addEventListener('submit', function(event) {
      // Prevent default page refresh on submit
      event.preventDefault();

      // Retrieve values from inputs
      const firstName = document.getElementById('fname').value;
      const lastName = document.getElementById('lname').value;

      // Construct object
      const data = {
        name: firstName,
        lastname: lastName
      };

      // Convert object to JSON string
      const jsonString = JSON.stringify(data);

      // Append output to the DOM
      document.getElementById('output').textContent = jsonString;
    });
  </script>

</body>
</html>
