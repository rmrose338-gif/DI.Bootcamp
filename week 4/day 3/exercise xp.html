<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 1 - HTML Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <form action="" method="GET">
    <div class="form-group">
      <label for="username">Name:</label>
      <input type="text" id="username" name="username" required>
    </div>

    <div class="form-group">
      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" cols="30" required></textarea>
    </div>

    <input type="submit" value="Send">
  </form>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 3 - JSON Mario</title>
</head>
<body>

  <h1>Exercise 3: JSON Mario</h1>
  <p>Open your browser console / developer tools to see the output.</p>

  <script>
    const marioGame = {
      detail : "An amazing game!",
      characters : {
          mario : {
            description:"Small and jumpy. Likes princesses.",
            height: 10,
            weight: 3,
            speed: 12,
          },
          bowser : {
            description: "Big and green, Hates princesses.",
            height: 16,
            weight: 6,
            speed: 4,
          },
          princessPeach : {
            description: "Beautiful princess.",
            height: 12,
            weight: 2,
            speed: 2,
          }
      },
    };

    
    const jsonMario = JSON.stringify(marioGame);
    console.log("Standard JSON String:");
    console.log(jsonMario);
    const prettyJsonMario = JSON.stringify(marioGame, null, 2);
    console.log("\nPretty Printed JSON String:");
    console.log(prettyJsonMario);

    
    debugger; 
  </script>

</body>
</html>
