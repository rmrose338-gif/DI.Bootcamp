<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giphy Random Search</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    form {
      margin-bottom: 10px;
    }
    .gif-card {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      margin: 10px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .gif-card img {
      max-width: 250px;
      margin-bottom: 8px;
    }
    .delete-btn {
      background-color: #ff4d4d;
      color: white;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <!-- Search Form -->
  <form id="search-form">
    <input type="text" id="category-input" placeholder="Search for a GIF category..." required>
    <button type="submit">Fetch GIF</button>
  </form>

  <!-- Delete All Button -->
  <button id="delete-all-btn">DELETE ALL</button>

  <!-- GIF Container -->
  <div id="gif-container"></div>

  <script>
    const apiKey = "hpvZycW22qCjn5cRM1xtWB8NKq4dQ2My";
    const form = document.getElementById("search-form");
    const input = document.getElementById("category-input");
    const container = document.getElementById("gif-container");
    const deleteAllBtn = document.getElementById("delete-all-btn");

    // Fetch random GIF by category and append to DOM
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const category = input.value.trim();

      if (!category) return;

      try {
        const url = `https://api.giphy.com/v1/gifs/random?tag=${encodeURIComponent(category)}&api_key=${apiKey}`;
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(`HTTP Error Status: ${response.status}`);
        }

        const result = await response.json();
        
        // Ensure data and images exist
        if (result.data && result.data.images && result.data.images.original.url) {
          const gifUrl = result.data.images.original.url;
          createGifCard(gifUrl, category);
        } else {
          console.log("No GIF found for this category.");
        }
      } catch (error) {
        console.error("Fetch Error:", error.message);
      }

      input.value = "";
    });

    // Helper function to build GIF card with individual DELETE button
    function createGifCard(url, tag) {
      const card = document.createElement("div");
      card.className = "gif-card";

      const img = document.createElement("img");
      img.src = url;
      img.alt = `${tag} GIF`;

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "delete-btn";
      deleteBtn.textContent = "DELETE";
      
      // Delete specific GIF card on click
      deleteBtn.addEventListener("click", () => {
        card.remove();
      });

      card.appendChild(img);
      card.appendChild(deleteBtn);
      container.appendChild(card);
    }

    // Delete all GIFs from the container
    deleteAllBtn.addEventListener("click", () => {
      container.innerHTML = "";
    });
  </script>
</body>
</html>
