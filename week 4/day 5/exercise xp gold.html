<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS Exercises XP</title>
</head>
<body>

  <!-- Container for Exercise 1 GIF -->
  <div id="gif-container"></div>

  <script>
    
    // Exercise 1: Giphy API #2 (Fetch & Render GIF)
    
    async function fetchAndRenderGif() {
      try {
        const apiKey = "hpvZycW22qCjn5cRM1xtWB8NKq4dQ2My";
        const response = await fetch(`https://api.giphy.com/v1/gifs/random?api_key=${apiKey}&rating=g`);

        if (!response.ok) {
          throw new Error(`HTTP Error Status: ${response.status}`);
        }

        const dataObj = await response.json();
        
        // Extract the GIF image URL from images.original.url
        const gifUrl = dataObj.data.images.original.url;

        // Create img element and append to the container
        const img = document.createElement("img");
        img.src = gifUrl;
        img.alt = "Random GIF";
        document.getElementById("gif-container").appendChild(img);

        console.log("Exercise 1 Output: GIF rendered to page.");
      } catch (error) {
        console.error("Exercise 1 Error:", error.message);
      }
    }


    
    // Exercise 2: Analyze #2 (Sequential Start
    let resolveAfter2Seconds = function () {
      console.log("starting slow promise");
      return new Promise((resolve) => {
        setTimeout(function () {
          resolve("slow");
          console.log("slow promise is done");
        }, 2000);
      });
    };

    let resolveAfter1Second = function () {
      console.log("starting fast promise");
      return new Promise((resolve) => {
        setTimeout(function () {
          resolve("fast");
          console.log("fast promise is done");
        }, 1000);
      });
    };

    let sequentialStart = async function () {
      console.log("==SEQUENTIAL START==");
      const slow = await resolveAfter2Seconds();
      console.log(slow);
      const fast = await resolveAfter1Second();
      console.log(fast);
    };


    
    // Exercise 3: Analyze #3 (Concurrent Start)
  
    let concurrentStart = async function () {
      console.log("==CONCURRENT START with await==");
      const slow = resolveAfter2Seconds();
      const fast = resolveAfter1Second();
      console.log(await slow);
      console.log(await fast);
    };


    // Exercise 4: Modify fetch with Async/Await
    
    const urls = [
      "https://jsonplaceholder.typicode.com/users",
      "https://jsonplaceholder.typicode.com/posts",
      "https://jsonplaceholder.typicode.com/albums"
    ];

    const getData = async function () {
      try {
        // Replaced .then() chaining with async/await inside map
        const [users, posts, albums] = await Promise.all(
          urls.map(async (url) => {
            const resp = await fetch(url);
            if (!resp.ok) {
              throw new Error(`HTTP error: ${resp.status}`);
            }
            return await resp.json();
          })
        );

        console.log("users", users);
        console.log("posta", posts);
        console.log("albums", albums);
      } catch (error) {
        console.log("ooooooops");
      }
    };


    
    // Execution Flow
    
    (async () => {
      await fetchAndRenderGif();
      await sequentialStart();
      await getData();
      
      // Runs Exercise 3 after sequential operations finish
      setTimeout(concurrentStart, 1000);
    })();
  </script>
</body>
</html>
