<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunrise Time Comparison</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    form { display: flex; flex-direction: column; max-width: 400px; gap: 10px; margin-bottom: 20px; }
    .city-group { border: 1px solid #ccc; padding: 10px; border-radius: 4px; }
    label { display: block; margin-top: 5px; font-weight: bold; }
    input { width: 95%; padding: 6px; margin-top: 2px; }
    button { padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; margin-top: 10px; }
    #results { font-size: 1.1em; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Compare Sunrise Times</h2>

  <form id="sunrise-form">
    <!-- City 1 Inputs (Default: Paris) -->
    <div class="city-group">
      <h3>City 1</h3>
      <label for="lat1">Latitude:</label>
      <input type="number" step="any" id="lat1" value="48.864716" required>
      <label for="lng1">Longitude:</label>
      <input type="number" step="any" id="lng1" value="2.349014" required>
    </div>

    <!-- City 2 Inputs (Default: New York) -->
    <div class="city-group">
      <h3>City 2</h3>
      <label for="lat2">Latitude:</label>
      <input type="number" step="any" id="lat2" value="40.730610" required>
      <label for="lng2">Longitude:</label>
      <input type="number" step="any" id="lng2" value="-73.935242" required>
    </div>

    <button type="submit">Get Sunrise Times</button>
  </form>

  <div id="results"></div>

  <script>
    const form = document.getElementById("sunrise-form");
    const resultsDiv = document.getElementById("results");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      resultsDiv.textContent = "Fetching sunrise times...";

      // Retrieve values from the 4 inputs
      const lat1 = document.getElementById("lat1").value;
      const lng1 = document.getElementById("lng1").value;
      const lat2 = document.getElementById("lat2").value;
      const lng2 = document.getElementById("lng2").value;

      // Construct API URLs
      const url1 = `https://api.sunrise-sunset.org/json?lat=${lat1}&lng=${lng1}`;
      const url2 = `https://api.sunrise-sunset.org/json?lat=${lat2}&lng=${lng2}`;

      // Helper function to fetch and validate single endpoint
      const fetchSunrise = async (url) => {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`HTTP Error Status: ${response.status}`);
        }
        const data = await response.json();
        return data.results.sunrise;
      };

      try {
        // Use Promise.all() to wait for BOTH requests to resolve before displaying output
        const [sunrise1, sunrise2] = await Promise.all([
          fetchSunrise(url1),
          fetchSunrise(url2)
        ]);

        // Render results ONLY when both promises are resolved
        resultsDiv.innerHTML = `
          <p>🌇 City 1 Sunrise: ${sunrise1} (UTC)</p>
          <p>🌇 City 2 Sunrise: ${sunrise2} (UTC)</p>
        `;
      } catch (error) {
        console.error("Error fetching sunrise data:", error.message);
        resultsDiv.textContent = "Failed to retrieve sunrise data. Please check input values or try again.";
      }
    });
  </script>
</body>
</html>
