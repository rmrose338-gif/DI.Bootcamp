<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#3457D5">
  <title>Create account - Common Canvas</title><link rel="icon" href="/assets/icons/studio-mark.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/auth.css">
</head>
<body data-page="register">
  <header class="public-header"><a class="brand" href="/"><img src="/assets/icons/studio-mark.svg" alt=""><span>common<span class="brand-light">canvas</span></span></a><a class="header-back" href="/">Back to home <span aria-hidden="true">&#8599;</span></a></header>
  <main class="auth-layout"><section class="auth-aside"><p class="eyebrow">MAKE SOMETHING TOGETHER</p><h1>There's room<br>for your ideas.</h1><p>Start a canvas, invite a friend, and see where a blank page takes you.</p><div class="aside-lines" aria-hidden="true"><span></span><span></span><span></span></div></section>
    <section class="auth-panel"><div class="auth-heading"><p class="eyebrow">COME ON IN</p><h2>Create your account</h2><p>Your corner of the shared studio.</p></div>
      <form id="auth-form" class="form-stack" data-mode="register"><label>Your name<input name="name" type="text" autocomplete="name" minlength="2" maxlength="40" required placeholder="What should we call you?"></label><label>Email address<input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></label><button class="button button-pink button-wide" type="submit">Create account <span aria-hidden="true">&#8594;</span></button><p class="form-message" id="form-message" aria-live="polite"></p></form>
      <p class="auth-switch">Already have an account? <a href="/login.html">Sign in</a></p>
    </section>
  </main><script type="module" src="/js/main.js"></script><script type="module" src="/js/auth.js"></script>
</body>
</html>
