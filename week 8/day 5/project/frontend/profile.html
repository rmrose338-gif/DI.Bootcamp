<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#3457D5"><title>Your profile - Common Canvas</title><link rel="icon" href="/assets/icons/studio-mark.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/auth.css"></head>
<body data-page="profile">
  <header class="app-header"><a class="brand" href="/dashboard.html"><img src="/assets/icons/studio-mark.svg" alt=""><span>common<span class="brand-light">canvas</span></span></a><nav class="app-nav"><a href="/dashboard.html">My studio</a><a class="app-nav-active" href="/profile.html">Profile</a></nav><div class="header-user"><span class="user-label">Studio member</span><button class="avatar-button" type="button" data-profile-link aria-label="Open profile">CC</button></div></header>
  <main class="profile-main"><a class="text-link profile-back" href="/dashboard.html"><span aria-hidden="true">&#8592;</span> Back to your canvases</a><section class="profile-heading"><div class="profile-avatar" id="profile-avatar">CC</div><div><p class="eyebrow">YOUR ACCOUNT</p><h1>A little about you</h1><p>Let your collaborators know who's at the canvas.</p></div></section><section class="profile-panel"><form id="profile-form" class="form-stack"><label>Your name<input name="name" type="text" minlength="2" maxlength="40" required></label><label>Email address<input name="email" type="email" required></label><p class="form-message" id="profile-message" aria-live="polite"></p><div class="profile-actions"><button class="button button-pink" type="submit">Save profile <span aria-hidden="true">&#8594;</span></button><button class="button button-outline" type="button" data-logout>Sign out</button></div></form></section></main>
